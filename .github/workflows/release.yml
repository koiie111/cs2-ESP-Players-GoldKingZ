name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Update CounterStrikeSharp.API to latest stable
        working-directory: cs2-ESP-Players-GoldKingZ
        run: dotnet add ESP-Players-GoldKingZ.csproj package CounterStrikeSharp.API

      - name: Build
        run: dotnet build cs2-ESP-Players-GoldKingZ/ESP-Players-GoldKingZ.csproj -c Release

      - name: Package
        run: |
          cd ESP-Players-GoldKingZ_Build
          zip -r ../ESP-Players-GoldKingZ.zip addons

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CSS_VERSION=$(grep -oP 'CounterStrikeSharp.API" Version="\K[^"]+' cs2-ESP-Players-GoldKingZ/ESP-Players-GoldKingZ.csproj)
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ESP-Players-GoldKingZ.zip \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build of ${GITHUB_SHA::7} on .NET 10, CounterStrikeSharp.API ${CSS_VERSION}. Unpack the archive into the game/csgo directory."
